<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1490" viewBox="0 0 1760 1490">
<title>Urban Wildlife Rescue Coordination System - Use Case Diagram</title>
<desc>Three actors and eight use cases. Reporting includes automatic priority assessment. Assignment includes searching for suitable available teams.</desc>
