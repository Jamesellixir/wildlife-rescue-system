<line x1="800" y1="835" x2="800" y2="765" stroke="#111827" stroke-width="2" stroke-dasharray="9 7"/>
<line x1="800" y1="765" x2="806.9266876331222" y2="778.3049238416893" stroke="#111827" stroke-width="2"/>
<line x1="800" y1="765" x2="793.0733123668778" y2="778.3049238416893" stroke="#111827" stroke-width="2"/>
<text x="880" y="800" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="21" fill="#111827">«include»</text>
<text x="490" y="1370" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="22" fill="#111827">Assumptions: the coordinator registers teams; rescue teams view assigned incidents and update their status.</text>
<text x="490" y="1420" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="22" fill="#4b5563">Solid lines: actor participation. Dashed arrows: required included behaviour.</text>
