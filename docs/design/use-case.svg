<text x="1240" y="257" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="26" fill="#111827">Priority</text>
<line x1="990" y1="240" x2="1110" y2="240" stroke="#111827" stroke-width="2" stroke-dasharray="9 7"/>
<line x1="1110" y1="240" x2="1096.6950761583107" y2="246.92668763312224" stroke="#111827" stroke-width="2"/>
