<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="1289" viewBox="0 0 1950 1289" role="img"><title>Match and assign a rescue team</title><desc>Suggestions are read-only. The coordinator selects a team and the manager rechecks capacity before saving.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#24364d" stroke-width="1.5"/></marker><marker id="inherit" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L13 7L1 13Z" fill="white" stroke="#24364d"/></marker></defs><style>text{font:17px Arial,sans-serif;fill:#14243b}.title{font:bold 31px Arial}.sub{font:17px Arial;fill:#405772}.label{font:bold 16px Arial}.name{font:bold 19px Arial}.small{font:15px Arial}.line,.dash,.life{stroke:#24364d;stroke-width:1.6;fill:none}.dash,.life{stroke-dasharray:6 5}.life{stroke:#8497aa}.box,.head,.decision,.error,.frame{stroke:#49647e;stroke-width:1.4;fill:#f2f7fb}.head{fill:#dbeaf6}.decision{fill:#fff6dc}.error{fill:#fff3ed}.frame{fill:none}.guard{font:bold 15px Arial;fill:#394f69}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="45" class="title">Match and assign a rescue team</text><text x="30" y="75" class="sub">Suggestions are read-only. The coordinator selects a team and the manager rechecks capacity before saving.</text><path d="M30 91H1920" class="line" /><rect x="58" y="108" width="304" height="45" rx="5" class="head"/><text x="210" y="137" text-anchor="middle" class="name">Coordinator</text><path d="M210 153V1264" class="life" /><rect x="428" y="108" width="304" height="45" rx="5" class="head"/><text x="580" y="137" text-anchor="middle" class="name">menu : ConsoleMenu</text><path d="M580 153V1264" class="life" /><rect x="798" y="108" width="304" height="45" rx="5" class="head"/><text x="950" y="137" text-anchor="middle" class="name">manager : IncidentManager</text><path d="M950 153V1264" class="life" /><rect x="1168" y="108" width="304" height="45" rx="5" class="head"/><text x="1320" y="137" text-anchor="middle" class="name">matcher : TeamMatcher</text><path d="M1320 153V1264" class="life" /><rect x="1538" y="108" width="304" height="45" rx="5" class="head"/><text x="1690" y="137" text-anchor="middle" class="name">files : FileManager</text><path d="M1690 153V1264" class="life" /><path d="M37 359H1913" class="dash" /><text x="47" y="381" class="guard">[pending incident]</text><path d="M106 974H1844" class="dash" /><text x="116" y="996" class="guard">[save failed]</text><rect x="106" y="831" width="1738" height="255" rx="0" class="frame"/><rect x="106" y="831" width="49" height="25" rx="0" class="head"/><text x="116" y="849" class="guard">alt</text><text x="165" y="849" class="guard">[save succeeded]</text><path d="M83 1095H1867" class="dash" /><text x="93" y="1117" class="guard">[incident changed or team no longer eligible]</text><rect x="83" y="721" width="1784" height="486" rx="0" class="frame"/><rect x="83" y="721" width="49" height="25" rx="0" class="head"/><text x="93" y="739" class="guard">alt</text><text x="142" y="739" class="guard">[incident still pending and team still eligible]</text><rect x="60" y="541" width="1830" height="678" rx="0" class="frame"/><rect x="60" y="541" width="49" height="25" rx="0" class="head"/><text x="70" y="559" class="guard">opt</text><text x="119" y="559" class="guard">[candidates exist and coordinator selects a team]</text><rect x="37" y="252" width="1876" height="979" rx="0" class="frame"/><rect x="37" y="252" width="49" height="25" rx="0" class="head"/><text x="47" y="270" class="guard">alt</text><text x="96" y="270" class="guard">[unknown or non-pending incident]</text><text x="395" y="184" text-anchor="middle" class="small">Select incident from the priority queue</text><path d="M210 191H580" class="line" marker-end="url(#arrow)"/><text x="765" y="219" text-anchor="middle" class="small">findTeams(incidentId)</text><path d="M580 226H950" class="line" marker-end="url(#arrow)"/><text x="765" y="294" text-anchor="middle" class="small">Invalid selection</text><path d="M950 301H580" class="dash" marker-end="url(#arrow)"/><text x="395" y="329" text-anchor="middle" class="small">Ask for another incident</text><path d="M580 336H210" class="dash" marker-end="url(#arrow)"/><text x="1135" y="403" text-anchor="middle" class="small">rankEligible(incident, snapshot)</text><path d="M950 410H1320" class="line" marker-end="url(#arrow)"/><text x="1135" y="438" text-anchor="middle" class="small">Ranked teams and reasons</text><path d="M1320 445H950" class="dash" marker-end="url(#arrow)"/><text x="765" y="473" text-anchor="middle" class="small">Matching result</text><path d="M950 480H580" class="dash" marker-end="url(#arrow)"/><text x="395" y="508" text-anchor="middle" class="small">Show candidates or no-match notice</text><path d="M580 515H210" class="dash" marker-end="url(#arrow)"/><text x="395" y="583" text-anchor="middle" class="small">Choose team</text><path d="M210 590H580" class="line" marker-end="url(#arrow)"/><text x="765" y="618" text-anchor="middle" class="small">assignTeam(incidentId, teamId)</text><path d="M580 625H950" class="line" marker-end="url(#arrow)"/><text x="1135" y="653" text-anchor="middle" class="small">isEligible(incident, team, currentWorkload)</text><path d="M950 660H1320" class="line" marker-end="url(#arrow)"/><text x="1135" y="688" text-anchor="middle" class="small">Eligibility result</text><path d="M1320 695H950" class="dash" marker-end="url(#arrow)"/><text x="1320" y="763" text-anchor="middle" class="small">saveIncidents(candidate)</text><path d="M950 770H1690" class="line" marker-end="url(#arrow)"/><text x="1320" y="798" text-anchor="middle" class="small">Save result</text><path d="M1690 805H950" class="dash" marker-end="url(#arrow)"/><text x="964" y="874" class="small">Accept assignment and derive workload</text><path d="M950 880H1058V893H950" class="line" marker-end="url(#arrow)"/><text x="765" y="909" text-anchor="middle" class="small">Assignment confirmed</text><path d="M950 916H580" class="dash" marker-end="url(#arrow)"/><text x="395" y="944" text-anchor="middle" class="small">Show updated assignment</text><path d="M580 951H210" class="dash" marker-end="url(#arrow)"/><text x="765" y="1018" text-anchor="middle" class="small">Save error; keep original state</text><path d="M950 1025H580" class="dash" marker-end="url(#arrow)"/><text x="395" y="1053" text-anchor="middle" class="small">Show save failure</text><path d="M580 1060H210" class="dash" marker-end="url(#arrow)"/><text x="765" y="1139" text-anchor="middle" class="small">Assignment rejected; state unchanged</text><path d="M950 1146H580" class="dash" marker-end="url(#arrow)"/><text x="395" y="1174" text-anchor="middle" class="small">Show rejection reason</text><path d="M580 1181H210" class="dash" marker-end="url(#arrow)"/></svg>
