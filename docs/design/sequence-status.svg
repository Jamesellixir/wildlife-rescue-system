<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="1027" viewBox="0 0 1950 1027" role="img"><title>Update incident status</title><desc>A rescue team member or coordinator records progress. The manager commits the new state after saving.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#24364d" stroke-width="1.5"/></marker><marker id="inherit" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L13 7L1 13Z" fill="white" stroke="#24364d"/></marker></defs><style>text{font:17px Arial,sans-serif;fill:#14243b}.title{font:bold 31px Arial}.sub{font:17px Arial;fill:#405772}.label{font:bold 16px Arial}.name{font:bold 19px Arial}.small{font:15px Arial}.line,.dash,.life{stroke:#24364d;stroke-width:1.6;fill:none}.dash,.life{stroke-dasharray:6 5}.life{stroke:#8497aa}.box,.head,.decision,.error,.frame{stroke:#49647e;stroke-width:1.4;fill:#f2f7fb}.head{fill:#dbeaf6}.decision{fill:#fff6dc}.error{fill:#fff3ed}.frame{fill:none}.guard{font:bold 15px Arial;fill:#394f69}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="45" class="title">Update incident status</text><text x="30" y="75" class="sub">A rescue team member or coordinator records progress. The manager commits the new state after saving.</text><path d="M30 91H1920" class="line" /><rect x="58" y="108" width="304" height="45" rx="5" class="head"/><text x="210" y="137" text-anchor="middle" class="name">Team / Coordinator</text><path d="M210 153V1002" class="life" /><rect x="428" y="108" width="304" height="45" rx="5" class="head"/><text x="580" y="137" text-anchor="middle" class="name">menu : ConsoleMenu</text><path d="M580 153V1002" class="life" /><rect x="798" y="108" width="304" height="45" rx="5" class="head"/><text x="950" y="137" text-anchor="middle" class="name">manager : IncidentManager</text><path d="M950 153V1002" class="life" /><rect x="1168" y="108" width="304" height="45" rx="5" class="head"/><text x="1320" y="137" text-anchor="middle" class="name">incident : RescueIncident</text><path d="M1320 153V1002" class="life" /><rect x="1538" y="108" width="304" height="45" rx="5" class="head"/><text x="1690" y="137" text-anchor="middle" class="name">files : FileManager</text><path d="M1690 153V1002" class="life" /><path d="M37 359H1913" class="dash" /><text x="47" y="381" class="guard">[incident exists]</text><path d="M60 578H1890" class="dash" /><text x="70" y="600" class="guard">[transition accepted]</text><path d="M83 833H1867" class="dash" /><text x="93" y="855" class="guard">[save failed]</text><rect x="83" y="690" width="1784" height="255" rx="0" class="frame"/><rect x="83" y="690" width="49" height="25" rx="0" class="head"/><text x="93" y="708" class="guard">alt</text><text x="142" y="708" class="guard">[save succeeded]</text><rect x="60" y="471" width="1830" height="486" rx="0" class="frame"/><rect x="60" y="471" width="49" height="25" rx="0" class="head"/><text x="70" y="489" class="guard">alt</text><text x="119" y="489" class="guard">[transition rejected]</text><rect x="37" y="252" width="1876" height="717" rx="0" class="frame"/><rect x="37" y="252" width="49" height="25" rx="0" class="head"/><text x="47" y="270" class="guard">alt</text><text x="96" y="270" class="guard">[unknown incident]</text><text x="395" y="184" text-anchor="middle" class="small">Enter incident ID and requested status</text><path d="M210 191H580" class="line" marker-end="url(#arrow)"/><text x="765" y="219" text-anchor="middle" class="small">updateStatus(id, nextStatus)</text><path d="M580 226H950" class="line" marker-end="url(#arrow)"/><text x="765" y="294" text-anchor="middle" class="small">Unknown incident</text><path d="M950 301H580" class="dash" marker-end="url(#arrow)"/><text x="395" y="329" text-anchor="middle" class="small">Show ID error</text><path d="M580 336H210" class="dash" marker-end="url(#arrow)"/><text x="1135" y="403" text-anchor="middle" class="small">withStatus(nextStatus)</text><path d="M950 410H1320" class="line" marker-end="url(#arrow)"/><text x="1135" y="438" text-anchor="middle" class="small">Candidate incident or transition error</text><path d="M1320 445H950" class="dash" marker-end="url(#arrow)"/><text x="765" y="513" text-anchor="middle" class="small">Allowed next status</text><path d="M950 520H580" class="dash" marker-end="url(#arrow)"/><text x="395" y="548" text-anchor="middle" class="small">Show transition error</text><path d="M580 555H210" class="dash" marker-end="url(#arrow)"/><text x="1320" y="622" text-anchor="middle" class="small">saveIncidents(candidate)</text><path d="M950 629H1690" class="line" marker-end="url(#arrow)"/><text x="1320" y="657" text-anchor="middle" class="small">Save result</text><path d="M1690 664H950" class="dash" marker-end="url(#arrow)"/><text x="964" y="733" class="small">Accept saved state and derive workload</text><path d="M950 739H1058V752H950" class="line" marker-end="url(#arrow)"/><text x="765" y="768" text-anchor="middle" class="small">Status confirmed</text><path d="M950 775H580" class="dash" marker-end="url(#arrow)"/><text x="395" y="803" text-anchor="middle" class="small">Show status and released capacity if completed</text><path d="M580 810H210" class="dash" marker-end="url(#arrow)"/><text x="765" y="877" text-anchor="middle" class="small">Save error; keep original status</text><path d="M950 884H580" class="dash" marker-end="url(#arrow)"/><text x="395" y="912" text-anchor="middle" class="small">Show save failure</text><path d="M580 919H210" class="dash" marker-end="url(#arrow)"/></svg>
