<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1061" viewBox="0 0 1250 1061" role="img"><title>Generate a rescue report</title><desc>The coordinator receives status totals and a CSV export.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#24364d" stroke-width="1.5"/></marker><marker id="inherit" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L13 7L1 13Z" fill="white" stroke="#24364d"/></marker></defs><style>text{font:17px Arial,sans-serif;fill:#14243b}.title{font:bold 31px Arial}.sub{font:17px Arial;fill:#405772}.label{font:bold 16px Arial}.name{font:bold 19px Arial}.small{font:15px Arial}.line,.dash,.life{stroke:#24364d;stroke-width:1.6;fill:none}.dash,.life{stroke-dasharray:6 5}.life{stroke:#8497aa}.box,.head,.decision,.error,.frame{stroke:#49647e;stroke-width:1.4;fill:#f2f7fb}.head{fill:#dbeaf6}.decision{fill:#fff6dc}.error{fill:#fff3ed}.frame{fill:none}.guard{font:bold 15px Arial;fill:#394f69}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="45" class="title">Generate a rescue report</text><text x="30" y="75" class="sub">The coordinator receives status totals and a CSV export.</text><path d="M30 91H1220" class="line" /><path d="M338 125V139" class="line" marker-end="url(#arrow)"/><path d="M338 204V244" class="line" marker-end="url(#arrow)"/><path d="M338 306V344" class="line" marker-end="url(#arrow)"/><path d="M508 377H770" class="line" marker-end="url(#arrow)"/><text x="525" y="368" class="guard">[no]</text><path d="M977 402V530H359" class="line" marker-end="url(#arrow)"/><path d="M338 410V448" class="line" marker-end="url(#arrow)"/><text x="350" y="429" class="guard">[yes]</text><path d="M338 510V520" class="line" marker-end="url(#arrow)"/><path d="M338 540V550" class="line" marker-end="url(#arrow)"/><path d="M338 612V652" class="line" marker-end="url(#arrow)"/