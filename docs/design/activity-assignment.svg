<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1367" viewBox="0 0 1250 1367" role="img"><title>Match and assign a rescue team</title><desc>Process pending incidents in priority order and recheck the selected team before saving.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#24364d" stroke-width="1.5"/></marker><marker id="inherit" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L13 7L1 13Z" fill="white" stroke="#24364d"/></marker></defs><style>text{font:17px Arial,sans-serif;fill:#14243b}.title{font:bold 31px Arial}.sub{font:17px Arial;fill:#405772}.label{font:bold 16px Arial}.name{font:bold 19px Arial}.small{font:15px Arial}.line,.dash,.life{stroke:#24364d;stroke-width:1.6;fill:none}.dash,.life{stroke-dasharray:6 5}.life{stroke:#8497aa}.box,.head,.decision,.error,.frame{stroke:#49647e;stroke-width:1.4;fill:#f2f7fb}.head{fill:#dbeaf6}.decision{fill:#fff6dc}.error{fill:#fff3ed}.frame{fill:none}.guard{font:bold 15px Arial;fill:#394f69}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="45" class="title">Match and assign a rescue team</text><text x="30" y="75" class="sub">Process pending incidents in priority order and recheck the selected team before saving.</text><path d="M30 91H1220" class="line" /><path d="M338 125V139" class="line" marker-end="url(#arrow)"/><path d="M338 204V242" class="line" marker-end="url(#arrow)"/><path d="M508 275H770" class="line" marker-end="url(#arrow)"/><text x="525" y="266" class="guard">[no]</text><path d="M1185 275H1206" class="line" marker-end="url(#arrow)"/><circle cx="1218" cy="275" r="12" fill="white" stroke="#24364d" stroke-width="2"/><circle cx="1218" cy="275" r="7" fill="#24364d"/><path d="M338 308V346" class="line" marker-end="url(#arrow)"/><text x="350" y="327" class="guard">[yes]</text><path d="M338 408V446" class="line" marker-end="url(#arrow)"/><path d="M508 479H770" class="line" marker-end="url(#arrow)"/><text x="525" y="470" class="guard">[no]</text><path d="M1185 479H1206" class="line" marker-end="url(#arrow)"/><path d="M338 512V550" class="line" marker-end="url(#arrow)"/><text x="350" y="531" class="guard">[yes]</text><path d="M338 612V652" class="line" marker-end="url(#arrow)"/><path d="M338 714V752" class="line" marker-end="url(#arrow)"/><path d="M508 785H770" class="line" marker-end="url(#arrow)"/><text x="525" y="776" class="guard">[no]</text><path d="M1185 785H1206" class="line" marker-end="url(#arrow)"/><path d="M338 818V854" class="line" marker-end="url(#arrow)"/><text x="350" y="837" class="guard">[yes]</text><path d="M508 887H770" class="line" marker-end="url(#arrow)"/><text x="525" y="878" class="guard">[no]</text><path d="M1185 887H1206" class="line" marker-end="url(#arrow)"/><path d="M338 920V958" class="line" marker-end="url(#arrow)"/><text x="350" y="939" class="guard">[yes]</text><path d="M338 1020V1058" class="line" marker-end="url(#arrow)"/><path d="M508 1091H770" class="line" marker-end="url(#arrow)"/><text x="525" y="1082" class="guard">[no]</text><path d="M1185 1091H1206" class="line" marker-end="url(#arrow)"/><path d="M338 1124V1162" class="line" marker-end="url(#arrow)"/><text x="350" y="1143" class="guard">[yes]</text><path d="M338 1224V1258" class="line" marker-end="url(#arrow)"/><circle cx="338" cy="117" r="8" fill="#24364d"/><rect x="70" y="142" width="536" height="62" rx="12" class="box"/><text x="338" y="179" text-anchor="middle">Select a pending incident</text><polygon points="338,242 508,275 338,308 168,275" class="decision"/><text x="338" y="281" text-anchor="middle">Incident is pending?</text><rect x="770" y="250" width="415" height="50" rx="12" class="error"/><text x="977" y="281" text-anchor="middle">Show invalid selection</text><rect x="70" y="346" width="536" height="62" rx="12" class="box"/><text x="338" y="372" text-anchor="middle">Filter by category, skills, equipment, availability and</text><text x="338" y="394" text-anchor="middle">capacity</text><polygon points="338,446 508,479 338,512 168,479" class="decision"/><text x="338" y="485" text-anchor="middle">Eligible teams found?</text><rect x="770" y="454" width="415" height="50" rx="12" class="error"/><text x="977" y="485" text-anchor="middle">Show no match; incident stays pending</text><circle cx="1218" cy="479" r="12" fill="white" stroke="#24364d" stroke-width="2"/><circle cx="1218" cy="479" r="7" fill="#24364d"/><rect x="70" y="550" width="536" height="62" rx="12" class="box"/><text x="338" y="587" text-anchor="middle">Rank by same zone, workload ratio, then team ID</text><rect x="70" y="652" width="536" height="62" rx="12" class="box"/><text x="338" y="689" text-anchor="middle">Show candidates and ask coordinator to choose</text><polygon points="338,752 508,785 338,818 168,785" class="decision"/><text x="338" y="791" text-anchor="middle">Coordinator chose a team?</text><rect x="770" y="760" width="415" height="50" rx="12" class="error"/><text x="977" y="791" text-anchor="middle">Return without assigning</text><circle cx="1218" cy="785" r="12" fill="white" stroke="#24364d" stroke-width="2"/><circle cx="1218" cy="785" r="7" fill="#24364d"/><polygon points="338,854 508,887 338,920 168,887" class="decision"/><text x="338" y="893" text-anchor="middle">Still pending and team eligible?</text><rect x="770" y="862" width="415" height="50" rx="12" class="error"/><text x="977" y="893" text-anchor="middle">Show rejection; no assignment saved</text><circle cx="1218" cy="887" r="12" fill="white" stroke="#24364d" stroke-width="2"/><circle cx="1218" cy="887" r="7" fill="#24364d"/><rect x="70" y="958" width="536" height="62" rx="12" class="box"/><text x="338" y="984" text-anchor="middle">Stage Assigned status and selected team; save incident</text><text x="338" y="1006" text-anchor="middle">CSV</text><polygon points="338,1058 508,1091 338,1124 168,1091" class="decision"/><text x="338" y="1097" text-anchor="middle">Save succeeded?</text><rect x="770" y="1066" width="415" height="50" rx="12" class="error"/><text x="977" y="1097" text-anchor="middle">Show save error; discard staged assignment</text><circle cx="1218" cy="1091" r="12" fill="white" stroke="#24364d" stroke-width="2"/><circle cx="1218" cy="1091" r="7" fill="#24364d"/><rect x="70" y="1162" width="536" height="62" rx="12" class="box"/><text x="338" y="1199" text-anchor="middle">Confirm assignment and show derived workload</text><circle cx="338" cy="1270" r="12" fill="white" stroke="#24364d" stroke-width="2"/><circle cx="338" cy="1270" r="7" fill="#24364d"/></svg>
