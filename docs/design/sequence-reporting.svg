<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="974" viewBox="0 0 1950 974" role="img"><title>Report an incident</title><desc>Create the incident, assess its priority and confirm the report after saving.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#24364d" stroke-width="1.5"/></marker><marker id="inherit" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L13 7L1 13Z" fill="white" stroke="#24364d"/></marker></defs><style>text{font:17px Arial,sans-serif;fill:#14243b}.title{font:bold 31px Arial}.sub{font:17px Arial;fill:#405772}.label{font:bold 16px Arial}.name{font:bold 19px Arial}.small{font:15px Arial}.line,.dash,.life{stroke:#24364d;stroke-width:1.6;fill:none}.dash,.life{stroke-dasharray:6 5}.life{stroke:#8497aa}.box,.head,.decision,.error,.frame{stroke:#49647e;stroke-width:1.4;fill:#f2f7fb}.head{fill:#dbeaf6}.decision{fill:#fff6dc}.error{fill:#fff3ed}.frame{fill:none}.guard{font:bold 15px Arial;fill:#394f69}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="45" class="title">Report an incident</text><text x="30" y="75" class="sub">Create the incident, assess its priority and confirm the report after saving.</text><path d="M30 91H1920" class="line" /><rect x="58" y="108" width="304" height="45" rx="5" class="head"/><text x="210" y="137" text-anchor="middle" class="name">Reporter</text><path d="M210 153V949" class="life" /><rect x="428" y="108" width="304" height="45" rx="5" class="head"/><text x="580" y="137" text-anchor="middle" class="name">menu : ConsoleMenu</text><path d="M580 153V949" class="life" /><rect x="798" y="108" width="304" height="45" rx="5" class="head"/><text x="950" y="137" text-anchor="middle" class="name">manager : IncidentManager</text><path d="M950 153V949" class="life" /><rect x="1168" y="108" width="304" height="45" rx="5" class="head"/><text 