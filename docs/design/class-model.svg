<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1601" viewBox="0 0 1800 1601" role="img"><title>Wildlife Rescue System class model</title><desc>Design signatures are provisional. The console, services, domain objects and storage have separate responsibilities.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#24364d" stroke-width="1.5"/></marker><marker id="inherit" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L13 7L1 13Z" fill="white" stroke="#24364d"/></marker></defs><style>text{font:17px Arial,sans-serif;fill:#14243b}.title{font:bold 31px Arial}.sub{font:17px Arial;fill:#405772}.label{font:bold 16px Arial}.name{font:bold 19px Arial}.small{font:15px Arial}.line,.dash,.life{stroke:#24364d;stroke-width:1.6;fill:none}.dash,.life{stroke-dasharray:6 5}.life{stroke:#8497aa}.box,.head,.decision,.error,.frame{stroke:#49647e;stroke-width:1.4;fill:#f2f7fb}.head{fill:#dbeaf6}.decision{fill:#fff6dc}.error{fill:#fff3ed}.frame{fill:none}.guard{font:bold 15px Arial;fill:#394f69}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="45" class="title">Wildlife Rescue System class model</text><text x="30" y="75" class="sub">Design signatures are provisional. The console, services, domain objects and storage have separate responsibilities.</text><path d="M30 91H1770" class="line" /><path d="M290 166H350" class="dash" marker-end="url(#arrow)"/><path d="M690 166H770" class="dash" marker-end="url(#arrow)"/><path d="M1225 190H1335" class="dash" marker-end="url(#arrow)"/><path d="M811 455V478H220V504" class="dash" marker-end="url(#arrow)"/><path d="M875 455V492H630V504" class="dash" marker-end="url(#arrow)"/><path d="M1225 445H1280V532H1335" class="dash" marker-end="url(#arrow)"/><path d="M950 455V664H865V740" class="line" marker-end="url(#arrow)"/><text x="876" y="726" class="small">0..*</text><path d="M1105 455V665H1195V740" class="line" marker-end="url(#arrow)"/><text x="1206" y="726" class="small">0..*</text><path d="M925 830H1120" class="line" /><text x="935" y="819" class="small">0..*</text><text x="1081" y="819" class="small">0..1</text><text x="1022" y="855" text-anchor="middle" class="small">assigned team</text><polygon points="570,1090 578,1100 570,1110 562,1100" fill="#24364d"/><path d="M570 1110V1150" class="line" /><text x="583" y="1138" class="small">1</text><path d="M262 1420V1371H570" class="line" /><path d="M617 1420V1371H570" class="line" /><path d="M972 1420V1371H570" class="line" /><path d="M570 1371V1333" class="line" marker-end="url(#inherit)"/><rect x="40" y="135" width="250" height="80" rx="0" class="box"/><rect x="40" y="135" width="250" height="40" rx="0" class="head"/><text x="165" y="161" text-anchor="middle" class="name">Main</text><text x="54" y="198" class="small">+ main(args: String[]): void</text><rect x="350" y="135" width="340" height="143" rx="0" class="box"/><rect x="350" y="135" width="340" height="40" rx="0" class="head"/><text x="520" y="161" text-anchor="middle" class="name">ConsoleMenu</text><text x="364" y="198" class="small">- manager: IncidentManager</text><path d="M350 215H690" class="line" /><text x="364" y="238" class="small">+ run(): void</text><text x="364" y="261" class="small">- readIncidentDetails(): input</text><rect x="770" y="135" width="455" height="327" rx="0" class="box"/><rect x="770" y="135" width="455" height="40" rx="0" class="head"/><text x="997.5" y="161" text-anchor="middle" class="name">IncidentManager</text><text x="784" y="198" class="small">- incidents: Map&lt;UUID, RescueIncident&gt;</text><text x="784" y="221" class="small">- teams: Map&lt;String, RescueTeam&gt;</text><text x="784" y="244" class="small">- files: FileManager</text><path d="M770 261H1225" class="line" /><text x="784" y="284" class="small">+ reportIncident(details): result</text><text x="784" y="307" class="small">+ findTeams(id): ranked candidates</text><text x="784" y="330" class="small">+ assignTeam(id, teamId): result</text><text x="784" y="353" class="small">+ updateStatus(id, nextStatus): result</text><text x="784" y="376" class="small">+ registerTeam(profile): result</text><text x="784" y="399" class="small">+ setAvailability(teamId, available): result</text><text x="784" y="422" class="small">+ matchPendingConcurrently(): results</text><text x="784" y="445" class="small">+ generateReport(): summary</text><rect x="1335" y="135" width="420" height="212" rx="0" class="box"/><rect x="1335" y="135" width="420" height="40" rx="0" class="head"/><text x="1545" y="161" text-anchor="middle" class="name">FileManager</text><text x="1349" y="198" class="small">- dataDirectory: Path</text><path d="M1335 215H1755" class="line" /><text x="1349" y="238" class="small">+ loadAll(): validated records</text><text x="1349" y="261" class="small">+ saveIncidents(candidate): void</text><text x="1349" y="284" class="small">+ saveTeams(candidate): void</text><text x="1349" y="307" class="small">+ writeReport(summary): Path</text><text x="1349" y="330" class="small">+ acquireWriterLock(): lock</text><rect x="40" y="504" width="355" height="80" rx="0" class="box"/><rect x="40" y="504" width="355" height="40" rx="0" class="head"/><text x="217.5" y="530" text-anchor="middle" class="name">PriorityCalculator</text><text x="54" y="567" class="small">+ assess(incident): score breakdown</text><rect x="455" y="504" width="350" height="103" rx="0" class="box"/><rect x="455" y="504" width="350" height="40" rx="0" class="head"/><text x="630" y="530" text-anchor="middle" class="name">TeamMatcher</text><text x="469" y="567" class="small">+ rankEligible(incident, snapshot): list</text><text x="469" y="590" class="small">+ isEligible(incident, team, workload): boolean</text><rect x="1335" y="504" width="420" height="80" rx="0" class="box"/><rect x="1335" y="504" width="420" height="40" rx="0" class="head"/><text x="1545" y="530" text-anchor="middle" class="name">RescueReportService</text><text x="1349" y="567" class="small">+ summarise(incidents): summary</text><rect x="360" y="740" width="565" height="350" rx="0" class="box"/><rect x="360" y="740" width="565" height="40" rx="0" class="head"/><text x="642.5" y="766" text-anchor="middle" class="name">RescueIncident</text><text x="374" y="803" class="small">- id: UUID</text><text x="374" y="826" class="small">- reportedAt: Instant</text><text x="374" y="849" class="small">- animal: Animal</text><text x="374" y="872" class="small">- location, zone, reporterName, reporterContact: String</text><text x="374" y="895" class="small">- immediateDanger: boolean</text><text x="374" y="918" class="small">- risk: EnvironmentalRisk</text><text x="374" y="941" class="small">- requiredSkills: Set&lt;Skill&gt;</text><text x="374" y="964" class="small">- requiredEquipment: Set&lt;Equipment&gt;</text><text x="374" y="987" class="small">- status: IncidentStatus</text><text x="374" y="1010" class="small">- assignedTeamId: String [0..1]</text><path d="M360 1027H925" class="line" /><text x="374" y="1050" class="small">+ withAssignment(teamId): RescueIncident</text><text x="374" y="1073" class="small">+ withStatus(nextStatus): RescueIncident</text><rect x="1120" y="740" width="560" height="281" rx="0" class="box"/><rect x="1120" y="740" width="560" height="40" rx="0" class="head"/><text x="1400" y="766" text-anchor="middle" class="name">RescueTeam</text><text x="1134" y="803" class="small">- id, name, baseZone: String</text><text x="1134" y="826" class="small">- members: List&lt;String&gt;</text><text x="1134" y="849" class="small">- categories: Set&lt;AnimalCategory&gt;</text><text x="1134" y="872" class="small">- skills: Set&lt;Skill&gt;</text><text x="1134" y="895" class="small">- equipment: Set&lt;Equipment&gt;</text><text x="1134" y="918" class="small">- operationallyAvailable: boolean</text><text x="1134" y="941" class="small">- capacity: int</text><path d="M1120 958H1680" class="line" /><text x="1134" y="981" class="small">+ withAvailability(available): RescueTeam</text><text x="1134" y="1004" class="small">+ status(activeCount): TeamStatus</text><rect x="370" y="1150" width="410" height="183" rx="0" class="box"/><rect x="370" y="1150" width="410" height="57" rx="0" class="head"/><text x="575" y="1169" text-anchor="middle" class="small">«abstract»</text><text x="575" y="1193" text-anchor="middle" class="name">Animal</text><text x="384" y="1230" class="small">- condition: Condition</text><text x="384" y="1253" class="small">- count: int</text><path d="M370 1270H780" class="line" /><text x="384" y="1293" class="small">+ category(): AnimalCategory</text><text x="384" y="1316" class="small">+ requiredHandlingSkill(): Skill</text><rect x="110" y="1420" width="305" height="103" rx="0" class="box"/><rect x="110" y="1420" width="305" height="40" rx="0" class="head"/><text x="262.5" y="1446" text-anchor="middle" class="name">Bird</text><text x="124" y="1483" class="small">+ category(): AnimalCategory</text><text x="124" y="1506" class="small">+ requiredHandlingSkill(): Skill</text><rect x="465" y="1420" width="305" height="103" rx="0" class="box"/><rect x="465" y="1420" width="305" height="40" rx="0" class="head"/><text x="617.5" y="1446" text-anchor="middle" class="name">Reptile</text><text x="479" y="1483" class="small">+ category(): AnimalCategory</text><text x="479" y="1506" class="small">+ requiredHandlingSkill(): Skill</text><rect x="820" y="1420" width="305" height="103" rx="0" class="box"/><rect x="820" y="1420" width="305" height="40" rx="0" class="head"/><text x="972.5" y="1446" text-anchor="middle" class="name">Mammal</text><text x="834" y="1483" class="small">+ category(): AnimalCategory</text><text x="834" y="1506" class="small">+ requiredHandlingSkill(): Skill</text><rect x="1170" y="1210" width="560" height="143" rx="0" class="box"/><rect x="1170" y="1210" width="560" height="57" rx="0" class="head"/><text x="1450" y="1229" text-anchor="middle" class="small">«enumerations»</text><text x="1450" y="1253" text-anchor="middle" class="name">Value types</text><text x="1184" y="1290" class="small">AnimalCategory, Condition, EnvironmentalRisk</text><text x="1184" y="1313" class="small">IncidentStatus, TeamStatus, PriorityLevel</text><text x="1184" y="1336" class="small">Skill, Equipment</text><text x="30" y="1570" class="sub">− private field     + public operation     Numbers show multiplicity. The filled diamond shows ownership.</text></svg>
