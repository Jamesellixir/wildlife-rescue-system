name: Java build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile, test and package (Linux)
        if: runner.os == 'Linux'
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Compile, test and package (Windows)
        if: runner.os == 'Windows'
        run: ./mvnw.cmd --batch-mode --no-transfer-progress clean verify
      - name: Launch packaged JAR
        shell: bash
        run: java -jar target/wildlife-rescue-system.jar < /dev/null
